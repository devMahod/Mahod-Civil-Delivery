    6422-HW-CS.dwg: "aaa6a6cd77698d84e672d4cf88d18699ee4f2656c3d0f8de70289e0d5c54d64e"
    6422-SM-MODEL-NATAZ.dwg: "ff97d2c50e4d8069c667fb25b0acef45214bcac4f51001a8df999d0f4c9119eb"
    6422-GM-MODEL-NATAZ.dwg: "46e79d5725145026d09443ce48c599be994f21119fd33a37bef44a31a262ff51"

sections:
  cl:
    source_files:
      # The CL instruction drawing is SEPARATE from the Civil model (Nataly's mail:
      # "the locations in the CL file"). Relative to the model drawing's folder, or
      # absolute. Forward slashes avoid YAML/C# escape traps.
      #
      # These are CANDIDATES only, and they are deliberately machine-independent: a
      # build-machine absolute path shipped here in 1.0.0 and resolved to nothing on
      # the engineer's machine. She points at the real file with "בחר קובץ CL" in the
      # panel, which rewrites this list.
      - "CL.dwg"
      - "../../Civil3d/PD/CL.dwg"
    # The layer CL.dwg draws its section lines on. Empty = discovery mode, which on a
    # real model turns every polyline into a candidate (bounded, but useless).
    layer_patterns: ["GFC111"]
    allowed_entity_types: ["LINE", "LWPOLYLINE", "POLYLINE"]
    intersection_tolerance_m: null      # OQ-004 — unresolved; exact intersection required until approved
    numbering:
      mode: null                        # OQ-003 — unresolved; labels reported, not trusted
      label_layer_patterns: []
      station_validation_enabled: false
      station_validation_tolerance_m: null

  projection:
    # Design-grade sections (1.2.0): utilities that live as polylines (UT-3D XREF and
    # host layers like MAIM*/BIUV*/HASHMAL*) are PROJECTED into each created section
    # at their true offset, with a Hebrew label; curbs become ticks with widths.
    # The utility layer dictionary is built in; rules here override/extend it.
    enabled: true
    # A CL drawn 88 m long made an 88 m section (engineer feedback 30/08); the line
    # still decides the direction, this caps the reach per side.
    max_half_width_m: 31
    # Real 6422 strip-edge layers (host plus Nataly's SM/GM files, 30-31/08):
    # HW-CURB / CURB-EXST / TR-ISLAND-CURBSTONE / HW-BIKE-LANE / PL-BIKE /
    # END-MDR-PL / HW-TRWY. Order matters: most specific first (TR-ISLAND-
    # CURBSTONE must be an island edge before *CURB* claims it as a plain curb).
    plan_mark_rules:
      # SM/GM evidence: these island-curb names must beat the generic *CURB* rule.
      - layer_pattern: "*CURB-ILND*"
        kind: "island"
        label: "אי תנועה"
      - layer_pattern: "*TR-ISLAND*"
        kind: "island"
        label: "אי תנועה"
      - layer_pattern: "*BIKE*"
        kind: "bike"
        label: "שביל אופניים"
      - layer_pattern: "END-MDR*"
        kind: "sidewalk"
        label: "מדרכה"
      - layer_pattern: "*MIDRACHA*"
        kind: "sidewalk"
        label: "מדרכה"
      - layer_pattern: "*SIDEWALK*"
        kind: "sidewalk"
        label: "מדרכה"
      - layer_pattern: "HW-TRWY*"
        kind: "lane"
        label: "שפת מיסעה"
      # Exact garden-boundary convention observed in Nataly's GM layer table.
      - layer_pattern: "*CURB-GRDN*"
        kind: "garden"
        label: "גבול גינון"
      - layer_pattern: "*CURB*"
        kind: "curb"
        label: "אבן שפה"
      # Nataly's SM model contains this exact bus-lane convention. It names the
      # containing strip but remains subject to the live visual acceptance gate.
      - layer_pattern: "KAV_NETIVIM_NTZ"
        kind: "strip"
        label: "נת\"צ"
      - layer_pattern: "ROW_2024-08"
        kind: "row"
        label: "זכות דרך"
      - layer_pattern: "*PGVUL*"
        kind: "row"
        label: "זכות דרך"
    # ROW layer names exist in several sources (GM and photogrammetry). Authority is
    # intentionally empty until an engineer chooses one exact SHA/path/XREF in-panel.
    row_authorities: []
    # Surface-name patterns that mean "existing ground" (dashed green style). Empty =
    # built-in defaults (*EG*, *EXIST*, *KAYAM*, *קיים*); set after the live round.
    existing_surface_patterns:
      - "MK"
      - "MK*"

  alignments:
    # 6422 design axes. The model also carries design VARIANTS of each axis
    # ("2000-des", "2000-des-Right-2.500", "1000 (1)", "600 (1)", "3000-DES") that run
    # parallel and make every section ambiguous. Sections are cut on the primary axis.
    allowed_names: ["2000", "1000", "3000", "600", "700", "750", "400", "500", "550", "580", "650", "680", "780", "800", "850", "880", "900"]
    explicit_source_to_alignment: {}    # user-confirmed CL-handle -> alignment name mappings persist here

  decisions:
    crossings: []
    exclusions: []
    traffic_directions: []
    # Filled only through the in-panel "שמות רצועות" approval dialog.
    span_labels: []

  sources:
    sampled_source_rules:
      - name: "existing-ground"
        kind: "surface"
        name_pattern: "*"
        required: true
    utility_source_rules: []            # populated from object-level discovery evidence, not guesses

