  quantity_sources:
    rules_ref: null
    source_scope_policy: null
    xref_policy: null                   # OQ-012
    rules:
      # ברירות מחדל של מהוד — אומתו מול נוסחי מחירון נת"י 08/2025 (31/08/2026).
      # כל שיוך ניתן לשינוי או ל"לא רלוונטי" בידי המהנדסת; היחידה נאכפת בשער.
      # Keep the proven SM island layer ahead of the broad curb family.  The semantic
      # guard also blocks a road-curb item for CURB-ILND in preserved older profiles.
      - rule_key: "mahod-default:CURB-ILND"
        layer_pattern: "*CURB-ILND*"
        measurement_kind: "length"
        candidate_catalog_code: "U51.06.2140"   # אבן שפה/עטרה לאי תנועה 25/25
        expected_unit: "מטר"
        notes: "ברירת מחדל מהוד — אבן שפה לאי תנועה (שכבת SM מוכחת)"
      - rule_key: "mahod-default:TR-ISLAND-CURBSTONE"
        layer_pattern: "*TR-ISLAND-CURBSTONE*"
        measurement_kind: "length"
        candidate_catalog_code: "U51.06.2140"   # אבן שפה/עטרה לאי תנועה 25/25
        expected_unit: "מטר"
        notes: "ברירת מחדל מהוד — אבן שפה לאי תנועה"
      - rule_key: "mahod-default:HW-CURB"
        layer_pattern: "HW-CURB*"
        measurement_kind: "length"
        candidate_catalog_code: "U51.06.1900"   # אבן שפה לכביש 17/25 ס"מ
        expected_unit: "מטר"
        notes: "ברירת מחדל מהוד — אבן שפה חדשה לכביש"
      - rule_key: "mahod-default:BIKE-LANE-EDGE"
        layer_pattern: "*BIKE-LANE*"
        measurement_kind: "length"
        candidate_catalog_code: "U51.06.2930"   # אבן שפה לשביל אופניים 50/30/25
        expected_unit: "מטר"
        notes: "ברירת מחדל מהוד — שפת שביל אופניים (HW-BIKE-LANE)"
      - rule_key: "mahod-default:PL-BIKE-EDGE"
        layer_pattern: "*PL-BIKE*"
        measurement_kind: "length"
        candidate_catalog_code: "U51.06.2930"   # אבן שפה לשביל אופניים 50/30/25
        expected_unit: "מטר"
        notes: "ברירת מחדל מהוד — שפת שביל אופניים (PL-BIKE)"
      # כמויות מהמודל (קורידור/חתכים) — מק"טים אומתו מול נת"י 08/2025:
      # מצע סוג א' U51.03.0010 (מ"ק ₪170.13), חפירה לאורך הדרך U51.02.0010
      # (מ"ק ₪22.48, כולל הובלה לאזורי מילוי), מילוי מובא U51.02.0230 (מ"ק ₪55.31).
      # שכבות האספלט (corridor:Pave*) בכוונה ללא שיוך — תא"צ מתומחר במ"ר לפי עובי
      # או בטון, בחירת סעיף היא החלטת מהנדסת.
      # קודי ה-Shapes האמיתיים ב-6422 (נקראו חי מהקורידור): MAZA=מצע,
      # ASF-5-19-70=אספלט 5 ס"מ תא"צ 19 (נשאר לבחירת סעיף ע"י המהנדסת), S5=לבירור.
      - rule_key: "mahod-default:corridor-maza"
        layer_pattern: "corridor:MAZA*"
        measurement_kind: "volume"
        candidate_catalog_code: "U51.03.0010"
        expected_unit: "מ\"ק"
        notes: "ברירת מחדל מהוד — מצע סוג א' מנפח הקורידור (קוד MAZA)"
      - rule_key: "mahod-default:corridor-base"
        layer_pattern: "corridor:Base*"
        measurement_kind: "volume"
        candidate_catalog_code: "U51.03.0010"
        expected_unit: "מ\"ק"
        notes: "ברירת מחדל מהוד — מצע סוג א' מנפח הקורידור"
      - rule_key: "mahod-default:corridor-subbase"
        layer_pattern: "corridor:SubBase*"
        measurement_kind: "volume"
        candidate_catalog_code: "U51.03.0010"
        expected_unit: "מ\"ק"
        notes: "ברירת מחדל מהוד — מצע סוג א' (שכבה תחתונה) מנפח הקורידור"
      - rule_key: "mahod-default:earthworks-cut"
        layer_pattern: "earthworks:cut"
        measurement_kind: "volume"
        candidate_catalog_code: "U51.02.0010"
        expected_unit: "מ\"ק"
        notes: "ברירת מחדל מהוד — חפירה לאורך הדרך; הסעיף כולל הובלה לאזורי מילוי"
      - rule_key: "mahod-default:earthworks-fill"
        layer_pattern: "earthworks:fill"
        measurement_kind: "volume"
        candidate_catalog_code: "U51.02.0230"
        expected_unit: "מ\"ק"
        notes: "ברירת מחדל מהוד — מילוי מובא; אם המילוי מגיע מהחפירה סעיף החפירה כבר מכסה — לאישור המהנדסת"

